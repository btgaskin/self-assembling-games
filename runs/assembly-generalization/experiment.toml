[[conditions]]
name = "gaussian-width-0.5"
preset = "oconnor.generalization.gaussian"

[conditions.overrides.adaptation.parameters.generalization]
width = 0.5

[[conditions]]
name = "gaussian-width-2"
preset = "oconnor.generalization.gaussian"

[conditions.overrides.adaptation.parameters.generalization]
